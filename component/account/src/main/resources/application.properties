spring.application.name=account
server.port=18101

eureka.client.service-url.defaultZone=http://localhost:18102/eureka/

spring.datasource.url=${KELARUS_ACCOUNT_DB_URL:jdbc:postgresql://localhost:5434/kelarus_account}
spring.datasource.username=${KELARUS_ACCOUNT_DB_USERNAME}
spring.datasource.password=${KELARUS_ACCOUNT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

kelarus.auth.jwt-secret=${KELARUS_AUTH_JWT_SECRET:}
kelarus.auth.access-token-ttl=15m
kelarus.auth.refresh-token-ttl=30d
kelarus.auth.email-verification-ttl=24h
kelarus.auth.password-reset-ttl=30m
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
# JDBC error details can contain email addresses or other persisted values.
# The API boundary logs a sanitized failure instead.
logging.level.org.hibernate.orm.jdbc.error=OFF
