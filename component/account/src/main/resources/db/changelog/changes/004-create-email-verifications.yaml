databaseChangeLog:
  - changeSet:
      id: 004-create-email-verifications
      author: kelarus
      changes:
        - createTable:
            tableName: email_verifications
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_email_verifications
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_email_verifications_token_hash
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: email_verifications
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_email_verifications_user
        - createIndex:
            tableName: email_verifications
            indexName: ix_email_verifications_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: email_verifications
            indexName: ix_email_verifications_expires_at
            columns:
              - column:
                  name: expires_at
