spring:
  application:
    name: account
  datasource:
    url: '${KELARUS_ACCOUNT_DB_URL:jdbc:postgresql://localhost:5434/kelarus_account}'
    username: '${KELARUS_ACCOUNT_DB_USERNAME}'
    password: '${KELARUS_ACCOUNT_DB_PASSWORD}'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 18101
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

eureka:
  client:
    service-url:
      defaultZone: '${KELARUS_EUREKA_URL:http://localhost:18102/eureka/}'
    register-with-eureka: true
    fetch-registry: true

kelarus:
  auth:
    jwt-secret: '${KELARUS_AUTH_JWT_SECRET:}'
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-verification-ttl: 24h
    password-reset-ttl: 30m

logging:
  level:
    # JDBC error details can contain email addresses or other persisted values.
    # The API boundary logs a sanitized failure instead.
    org.hibernate.orm.jdbc.error: 'OFF'
