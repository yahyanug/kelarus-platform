services:

  kelarus-platform-db:
    ports:
      - "5434:5432"


  kelarus-platform-es:
    ports:
      - "9201:9200"


  kelarus-platform-zookeeper:
    ports:
      - "2188:2188"


  kelarus-platform-broker:
    ports:
      - "9093:9092"

    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kelarus-platform-broker:29092,EXTERNAL://localhost:9093