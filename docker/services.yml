# Kelora Platform Infrastructure Services

name: kelora-platform-services

services:

  # =========================
  # PostgreSQL
  # =========================
  kelora-platform-db:
    image: postgres:17
    container_name: kelora-platform-db

    environment:
      POSTGRES_DB: kelora_platform
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${KELORA_POSTGRES_PASSWORD:?Set KELORA_POSTGRES_PASSWORD in docker/.env}

    ports:
      - "5434:5432"

    volumes:
      - kelora-platform-db:/var/lib/postgresql/data

    networks:
      - kelora-platform-network


  # =========================
  # Elasticsearch
  # =========================
  kelora-platform-es:
    image: elasticsearch:7.17.8
    container_name: kelora-platform-es

    environment:
      discovery.type: single-node
      xpack.security.enabled: true
      ELASTIC_PASSWORD: ${KELORA_ELASTIC_PASSWORD:?Set KELORA_ELASTIC_PASSWORD in docker/.env}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    ports:
      - "9201:9200"

    volumes:
      - kelora-platform-es:/usr/share/elasticsearch/data

    networks:
      - kelora-platform-network


  # =========================
  # Zookeeper
  # =========================
  kelora-platform-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: kelora-platform-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2188
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2188:2188"

    volumes:
      - kelora-platform-zookeeper:/var/lib/zookeeper

    networks:
      - kelora-platform-network


  # =========================
  # Kafka
  # =========================
  kelora-platform-broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kelora-platform-broker

    depends_on:
      - kelora-platform-zookeeper

    ports:
      - "9093:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: kelora-platform-zookeeper:2188

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kelora-platform-broker:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "kelora-platform-broker:29092",
          "--list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    volumes:
      - kelora-platform-broker:/var/lib/kafka

    networks:
      - kelora-platform-network


  # =========================
  # Redis Standalone
  # =========================
  kelora-platform-redis-standalone:
    image: redis:7
    container_name: kelora-platform-redis-standalone

    ports:
      - "6380:6379"

    volumes:
      - kelora-platform-redis:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--raw",
          "incr",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - kelora-platform-network


# =========================
# Networks
# =========================
networks:
  kelora-platform-network:
    name: kelora-platform-network


# =========================
# Volumes
# =========================
volumes:
  kelora-platform-db:
  kelora-platform-es:
  kelora-platform-zookeeper:
  kelora-platform-broker:
  kelora-platform-redis:
