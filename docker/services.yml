# Kelarus Platform Infrastructure Services

name: kelarus-platform-services

services:

  # =========================
  # PostgreSQL
  # =========================
  kelarus-platform-db:
    image: postgres:17
    container_name: kelarus-platform-db

    environment:
      POSTGRES_DB: kelarus_platform
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${KELARUS_POSTGRES_PASSWORD:?Set KELARUS_POSTGRES_PASSWORD in docker/.env}

    ports:
      - "5434:5432"

    volumes:
      - kelarus-platform-db:/var/lib/postgresql/data
      - ./postgres/init-account.sql:/docker-entrypoint-initdb.d/010-account.sql:ro

    networks:
      - kelarus-platform-network


  # =========================
  # Elasticsearch
  # =========================
  kelarus-platform-es:
    image: elasticsearch:7.17.8
    container_name: kelarus-platform-es

    environment:
      discovery.type: single-node
      xpack.security.enabled: true
      ELASTIC_PASSWORD: ${KELARUS_ELASTIC_PASSWORD:?Set KELARUS_ELASTIC_PASSWORD in docker/.env}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    ports:
      - "9201:9200"

    volumes:
      - kelarus-platform-es:/usr/share/elasticsearch/data

    networks:
      - kelarus-platform-network


  # =========================
  # Zookeeper
  # =========================
  kelarus-platform-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: kelarus-platform-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2188
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2188:2188"

    volumes:
      - kelarus-platform-zookeeper:/var/lib/zookeeper

    networks:
      - kelarus-platform-network


  # =========================
  # Kafka
  # =========================
  kelarus-platform-broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kelarus-platform-broker

    depends_on:
      - kelarus-platform-zookeeper

    ports:
      - "9093:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: kelarus-platform-zookeeper:2188

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kelarus-platform-broker:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "kelarus-platform-broker:29092",
          "--list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    volumes:
      - kelarus-platform-broker:/var/lib/kafka

    networks:
      - kelarus-platform-network


  # =========================
  # Redis Standalone
  # =========================
  kelarus-platform-redis-standalone:
    image: redis:7
    container_name: kelarus-platform-redis-standalone

    ports:
      - "6380:6379"

    volumes:
      - kelarus-platform-redis:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--raw",
          "incr",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - kelarus-platform-network


# =========================
# Networks
# =========================
networks:
  kelarus-platform-network:
    name: kelarus-platform-network


# =========================
# Volumes
# =========================
volumes:
  kelarus-platform-db:
  kelarus-platform-es:
  kelarus-platform-zookeeper:
  kelarus-platform-broker:
  kelarus-platform-redis:
