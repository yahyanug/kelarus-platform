name: kelarus-platform

services:

  kelarus-platform-db:
    image: postgres:17
    container_name: kelarus-platform-db

    environment:
      POSTGRES_DB: kelarus_platform
      POSTGRES_USER: ${KELARUS_POSTGRES_ADMIN_USERNAME:-user}
      POSTGRES_PASSWORD: ${KELARUS_POSTGRES_PASSWORD}

    volumes:
      - kelarus-platform-db:/var/lib/postgresql/data
      - ./postgres/init-schemas.sql:/docker-entrypoint-initdb.d/010-schemas.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KELARUS_POSTGRES_ADMIN_USERNAME:-user} -d kelarus_platform"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - kelarus-platform-network


  kelarus-platform-es:
    image: elasticsearch:7.17.8
    container_name: kelarus-platform-es

    environment:
      discovery.type: single-node
      xpack.security.enabled: true
      ELASTIC_PASSWORD: ${KELARUS_ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    volumes:
      - kelarus-platform-es:/usr/share/elasticsearch/data

    networks:
      - kelarus-platform-network


  kelarus-platform-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: kelarus-platform-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2188
      ZOOKEEPER_TICK_TIME: 2000

    volumes:
      - kelarus-platform-zookeeper:/var/lib/zookeeper

    networks:
      - kelarus-platform-network


  kelarus-platform-broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kelarus-platform-broker

    depends_on:
      - kelarus-platform-zookeeper

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: kelarus-platform-zookeeper:2188

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kelarus-platform-broker:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "kelarus-platform-broker:29092",
          "--list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    volumes:
      - kelarus-platform-broker:/var/lib/kafka

    networks:
      - kelarus-platform-network


networks:
  kelarus-platform-network:
    name: kelarus-platform-network


volumes:
  kelarus-platform-db:
  kelarus-platform-es:
  kelarus-platform-zookeeper:
  kelarus-platform-broker:
