name: kelarus-platform-apps

services:

  # =========================
  # Eureka Server
  # =========================
  kelarus-platform-eureka-server:
    image: kelarus-platform/eureka-server

    container_name: kelarus-platform-eureka-server

    ports:
      - "50001:50001"

    networks:
      kelarus-platform-network:
        aliases:
          - eureka-server

    environment:
      SERVER_PORT: 50001
      KELARUS_EUREKA_HOSTNAME: eureka-server


  # =========================
  # API Gateway
  # =========================
  kelarus-platform-api-gateway:
    image: kelarus-platform/api-gateway

    container_name: kelarus-platform-api-gateway

    depends_on:
      - kelarus-platform-eureka-server

    environment:
      SERVER_PORT: 50002
      KELARUS_EUREKA_URL: http://eureka-server:50001/eureka/

    ports:
      - "50002:50002"

    networks:
      kelarus-platform-network:
        aliases:
          - api-gateway


  # Account uses the existing PostgreSQL service on the shared network.
  kelarus-platform-account:
    image: kelarus-platform/account
    container_name: kelarus-platform-account
    depends_on:
      - kelarus-platform-eureka-server
    environment:
      SERVER_PORT: 50003
      KELARUS_EUREKA_URL: http://eureka-server:50001/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      KELARUS_ACCOUNT_DB_URL: jdbc:postgresql://kelarus-platform-db:5432/kelarus_account
      KELARUS_ACCOUNT_DB_USERNAME: ${KELARUS_ACCOUNT_DB_USERNAME:-user}
      KELARUS_ACCOUNT_DB_PASSWORD: ${KELARUS_ACCOUNT_DB_PASSWORD:?Set KELARUS_ACCOUNT_DB_PASSWORD}
      KELARUS_AUTH_JWT_SECRET: ${KELARUS_AUTH_JWT_SECRET:?Set KELARUS_AUTH_JWT_SECRET}
    ports:
      - "50003:50003"
    networks:
      kelarus-platform-network:
        aliases:
          - account

# =========================
# Existing external network
# =========================
networks:
  kelarus-platform-network:
    external: true
