port 26379

dir /tmp

sentinel resolve-hostnames yes
sentinel monitor kelarus-platform-redis-master kelarus-platform-redis-master 6379 $SENTINEL_QUORUM
sentinel down-after-milliseconds kelarus-platform-redis-master $SENTINEL_DOWN_AFTER
sentinel parallel-syncs kelarus-platform-redis-master 1
sentinel failover-timeout kelarus-platform-redis-master $SENTINEL_FAILOVER
